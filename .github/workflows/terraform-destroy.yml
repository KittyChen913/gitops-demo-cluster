name: "Terraform Destroy"

run-name: "Destroy ${{ inputs.environment }} infrastructure by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "選擇要銷毀的 environment"
        type: choice
        options:
          - dev
          - prod
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

# 與 apply 共用並行群組，避免同一環境同時執行 apply 與 destroy。
concurrency:
  group: tf-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    name: "Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Validate credentials
        env:
          TARGET_ENV: ${{ inputs.environment }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            echo "::error title=Missing Secret::AWS_ACCOUNT_ID repository secret is not configured"
            exit 1
          fi

          echo "Destroy request confirmed for ${TARGET_ENV}."

  destroy:
    name: "Destroy [${{ inputs.environment }}]"
    needs: preflight
    runs-on: ubuntu-latest

    # prod 環境應在 GitHub repository settings 設定 required reviewers。
    environment: ${{ inputs.environment }}

    env:
      TARGET_ENV: ${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_write_kubeconfig_files: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Fetch Linode Token
        uses: ./.github/actions/get-ssm-parameters
        with:
          name-selector: linode_token

      - name: Validate Shared Parameters
        run: |
          set -euo pipefail
          if [ -z "${LINODE_TOKEN:-}" ]; then
            echo "::error title=Missing Parameter::The SSM parameter selected by linode_token is empty"
            exit 1
          fi

      - name: Resolve automation VPN targets
        id: automation-vpn-targets
        env:
          CONTRACT_PATH: ${{ github.workspace }}/config/automation-vpn.json
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          jq -e \
            --arg target_env "${TARGET_ENV}" \
            '.schema_version == 2 and
             .identity == "ci-cluster" and
             (.profile_ssm_path == "/gitops/openvpn-dns/automation/ci-cluster/PROFILE") and
             (.password_ssm_path == "/gitops/openvpn-dns/automation/ci-cluster/PASSWORD") and
             (.expected_tunnel_ip | test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$"))' \
            "${CONTRACT_PATH}" >/dev/null

          # 獨立驗證 target_parameter_paths 數量：跟上面的 contract 檢查分開，
          # 這樣數量對不上時才能印出實際數字，而不是丟一句看不出原因的 jq 失敗。
          # 期望值來自 config/automation-vpn.json 自己的 expected_target_count
          # 欄位（跟 target_parameter_paths 放在同一個 environment 區塊），不是
          # 寫死在這個 workflow 裡——新增第三個 target 時只要改 JSON 那一個地方，
          # 兩個欄位天生放在一起，不會漏改其中一邊。
          expected_target_count="$(jq -r --arg target_env "${TARGET_ENV}" \
            '.environments[$target_env].expected_target_count' \
            "${CONTRACT_PATH}")"
          if ! [[ "${expected_target_count}" =~ ^[0-9]+$ ]]; then
            echo "::error title=Automation VPN Contract Mismatch::config/automation-vpn.json environments.${TARGET_ENV}.expected_target_count is missing or not a number." >&2
            exit 1
          fi
          actual_target_count="$(jq -r --arg target_env "${TARGET_ENV}" \
            '.environments[$target_env].target_parameter_paths | length' \
            "${CONTRACT_PATH}")"
          if [[ "${actual_target_count}" -ne "${expected_target_count}" ]]; then
            echo "::error title=Automation VPN Contract Mismatch::config/automation-vpn.json environments.${TARGET_ENV}.target_parameter_paths has ${actual_target_count} entr$([ "${actual_target_count}" = "1" ] && echo y || echo ies), but expected_target_count is ${expected_target_count}. Update both fields together in config/automation-vpn.json." >&2
            exit 1
          fi

          route_targets=()
          health_targets=()
          while IFS= read -r parameter_path; do
            endpoint="$(aws ssm get-parameter \
              --name "${parameter_path}" \
              --query Parameter.Value \
              --output text)"
            if [ -z "${endpoint}" ] || [ "${endpoint}" = "None" ]; then
              echo "::error title=Missing VPN Target::${parameter_path} is unavailable"
              exit 1
            fi
            endpoint_host="${endpoint#*://}"
            endpoint_host="${endpoint_host%%/*}"
            endpoint_host="${endpoint_host%%:*}"
            route_targets+=("${endpoint}")
            health_targets+=("${endpoint_host}:443")
          done < <(jq -r \
            --arg target_env "${TARGET_ENV}" \
            '.environments[$target_env].target_parameter_paths[]' \
            "${CONTRACT_PATH}")

          {
            echo "identity=$(jq -r '.identity' "${CONTRACT_PATH}")"
            echo "profile_parameter=$(jq -r '.profile_ssm_path' "${CONTRACT_PATH}")"
            echo "password_parameter=$(jq -r '.password_ssm_path' "${CONTRACT_PATH}")"
            echo "expected_tunnel_ip=$(jq -r '.expected_tunnel_ip' "${CONTRACT_PATH}")"
            echo "route_targets<<EOF"
            printf '%s\n' "${route_targets[@]}"
            echo "EOF"
            echo "health_targets<<EOF"
            printf '%s\n' "${health_targets[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Open automation VPN tunnel
        id: automation-vpn
        uses: ./.github/actions/open-automation-vpn-tunnel
        with:
          identity: ${{ steps.automation-vpn-targets.outputs.identity }}
          profile-ssm-parameter: ${{ steps.automation-vpn-targets.outputs.profile_parameter }}
          password-ssm-parameter: ${{ steps.automation-vpn-targets.outputs.password_parameter }}
          expected-tunnel-ip: ${{ steps.automation-vpn-targets.outputs.expected_tunnel_ip }}
          route-targets: ${{ steps.automation-vpn-targets.outputs.route_targets }}
          health-targets: ${{ steps.automation-vpn-targets.outputs.health_targets }}

      # 必須趁 Kubernetes API 仍可連線時，先移除 Phase 2 資源。
      - name: Plan Phase 2 Destroy
        id: plan_k8s
        working-directory: terraform/environments/${{ inputs.environment }}-k8s
        env:
          TF_VAR_linode_token: ${{ env.LINODE_TOKEN }}
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -reconfigure \
            -input=false

          set +e
          terraform state list > state-list.txt 2> state-list.err
          STATE_EXIT=$?
          set -e

          if [ "${STATE_EXIT}" -ne 0 ]; then
            if grep -q "No state file was found" state-list.err; then
              echo "has_resources=false" >> "$GITHUB_OUTPUT"
              echo "Phase 2 state does not exist; skipping."
              exit 0
            fi
            cat state-list.err
            exit "${STATE_EXIT}"
          fi

          MANAGED_RESOURCES=$(grep -v '^data\.' state-list.txt || true)
          if [ -z "${MANAGED_RESOURCES}" ]; then
            echo "has_resources=false" >> "$GITHUB_OUTPUT"
            echo "Phase 2 state has no managed resources; skipping."
            exit 0
          fi
          echo "has_resources=true" >> "$GITHUB_OUTPUT"

          TFVARS_ARGS=()
          if [ -f "terraform.tfvars" ]; then
            TFVARS_ARGS=(-var-file=terraform.tfvars)
          fi

          set +e
          terraform plan \
            -destroy \
            -detailed-exitcode \
            -no-color \
            -out=tfdestroy \
            "${TFVARS_ARGS[@]}" \
            > terraform-destroy-plan.log 2>&1
          PLAN_EXIT=$?
          set -e

          grep -v -iE "^[[:space:]]*(token|secret|pass[w]ord)[[:space:]]*=" \
            terraform-destroy-plan.log || true

          if [ "${PLAN_EXIT}" -ne 0 ] && [ "${PLAN_EXIT}" -ne 2 ]; then
            echo "::error title=Destroy Plan Failed::Phase 2 destroy plan exited with code ${PLAN_EXIT}"
            exit "${PLAN_EXIT}"
          fi

      - name: Destroy Phase 2 K8s Resources
        id: destroy_k8s
        if: steps.plan_k8s.outputs.has_resources == 'true'
        working-directory: terraform/environments/${{ inputs.environment }}-k8s
        env:
          TF_VAR_linode_token: ${{ env.LINODE_TOKEN }}
        run: |
          set +e
          terraform apply -auto-approve -no-color tfdestroy \
            > terraform-destroy-apply.log 2>&1
          APPLY_EXIT=$?
          set -e

          grep -v -iE "^[[:space:]]*(token|secret|pass[w]ord)[[:space:]]*=" \
            terraform-destroy-apply.log || true

          if [ "${APPLY_EXIT}" -ne 0 ]; then
            echo "::error title=Destroy Failed::Phase 2 destroy exited with code ${APPLY_EXIT}"
            exit "${APPLY_EXIT}"
          fi

      - name: Close automation VPN tunnel
        if: ${{ always() && steps.automation-vpn.outputs['state-directory'] != '' }}
        uses: ./.github/actions/close-automation-vpn-tunnel
        with:
          state-directory: ${{ steps.automation-vpn.outputs['state-directory'] }}

      - name: Plan Phase 1 Destroy
        id: plan_clusters
        working-directory: terraform/environments/${{ inputs.environment }}
        env:
          TF_VAR_linode_token: ${{ env.LINODE_TOKEN }}
          CONTRACT_PATH: ${{ github.workspace }}/config/worker-firewall/${{ inputs.environment }}.json
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -reconfigure \
            -input=false

          set +e
          terraform state list > state-list.txt 2> state-list.err
          STATE_EXIT=$?
          set -e

          if [ "${STATE_EXIT}" -ne 0 ]; then
            if grep -q "No state file was found" state-list.err; then
              echo "has_resources=false" >> "$GITHUB_OUTPUT"
              echo "Phase 1 state does not exist; skipping."
              exit 0
            fi
            cat state-list.err
            exit "${STATE_EXIT}"
          fi

          MANAGED_RESOURCES=$(grep -v '^data\.' state-list.txt || true)
          if [ -z "${MANAGED_RESOURCES}" ]; then
            echo "has_resources=false" >> "$GITHUB_OUTPUT"
            echo "Phase 1 state has no managed resources; skipping."
            exit 0
          fi
          echo "has_resources=true" >> "$GITHUB_OUTPUT"

          TFVARS_ARGS=()
          if [ -f "terraform.tfvars" ]; then
            TFVARS_ARGS=(-var-file=terraform.tfvars)
          fi

          input_required="$(jq -r '
            (.control_plane_acl.activation_enabled // false) or
            ([.clusters[].activation_enabled // false] | any)
          ' "${CONTRACT_PATH}")"
          if [ "${input_required}" = "true" ]; then
            # Destroy 只移除既有資源，Control Plane ACL 的 CIDR 值在銷毀時不影響實際行為，
            # 因此提供本地固定值即可，不依賴 openvpn-dns 管理的 VPN public egress IP SSM 參數。
            export TF_VAR_vpn_server_public_egress_ip="0.0.0.0"
          fi

          set +e
          terraform plan \
            -destroy \
            -detailed-exitcode \
            -no-color \
            -out=tfdestroy \
            "${TFVARS_ARGS[@]}" \
            > terraform-destroy-plan.log 2>&1
          PLAN_EXIT=$?
          set -e

          grep -v -iE "^[[:space:]]*(token|secret|pass[w]ord)[[:space:]]*=" \
            terraform-destroy-plan.log || true

          if [ "${PLAN_EXIT}" -ne 0 ] && [ "${PLAN_EXIT}" -ne 2 ]; then
            echo "::error title=Destroy Plan Failed::Phase 1 destroy plan exited with code ${PLAN_EXIT}"
            exit "${PLAN_EXIT}"
          fi

      - name: Destroy Phase 1 Linode Resources
        id: destroy_clusters
        if: steps.plan_clusters.outputs.has_resources == 'true'
        working-directory: terraform/environments/${{ inputs.environment }}
        env:
          TF_VAR_linode_token: ${{ env.LINODE_TOKEN }}
        run: |
          set +e
          terraform apply -auto-approve -no-color tfdestroy \
            > terraform-destroy-apply.log 2>&1
          APPLY_EXIT=$?
          set -e

          grep -v -iE "^[[:space:]]*(token|secret|pass[w]ord)[[:space:]]*=" \
            terraform-destroy-apply.log || true

          if [ "${APPLY_EXIT}" -ne 0 ]; then
            echo "::error title=Destroy Failed::Phase 1 destroy exited with code ${APPLY_EXIT}"
            exit "${APPLY_EXIT}"
          fi

      - name: Write Destroy Summary
        if: always()
        env:
          PHASE2_RESULT: ${{ steps.destroy_k8s.outcome }}
          PHASE1_RESULT: ${{ steps.destroy_clusters.outcome }}
        run: |
          {
            echo "## Terraform Destroy"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Phase 2 K8s | \`${PHASE2_RESULT}\` |"
            echo "| Phase 1 Linode | \`${PHASE1_RESULT}\` |"
            echo ""
            echo "The S3 state backend was retained for future Terraform apply runs."
          } >> "$GITHUB_STEP_SUMMARY"
