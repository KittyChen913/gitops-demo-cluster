# =============================================================================
# terraform-plan-stage.yml — 可重用 Terraform Plan
# =============================================================================
# 呼叫者: terraform-plan.yml
#
# 執行內容：
#   1. Phase 2 (k8s) 透過 S3 terraform_remote_state 讀取 Phase 1 state
#   2. terraform init → validate → plan（初始化、驗證與規劃）
#   3. 將淨化後的 plan 結果輸出至 GITHUB_STEP_SUMMARY
#
# 安全性：
#   - TF_VAR_write_kubeconfig_files=false（不將 kubeconfig 寫入磁碟）
#   - Plan 輸出已過濾敏感欄位
#   - terraform_wrapper=false 保留 -detailed-exitcode 的退出碼
# =============================================================================

name: "Terraform Plan Stage"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev | prod)"
        type: string
        required: true
      tf_dir:
        description: "Relative path to Terraform working directory"
        type: string
        required: true
      plan_key:
        description: "Unique plan label (e.g., dev-clusters, dev-k8s)"
        type: string
        required: true
      enforce_cluster_boundary:
        description: "Validate the Phase 1 saved plan against the Cluster boundary contract"
        type: boolean
        required: false
        default: false
    secrets:
      AWS_ACCOUNT_ID:
        description: "AWS account ID used by the OIDC role ARN"
        required: true

jobs:
  plan:
    name: "Plan [${{ inputs.plan_key }}]"
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.tf_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          # 停用 wrapper 以保留 -detailed-exitcode 的退出碼
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Fetch SSM Parameters
        uses: ./.github/actions/get-ssm-parameters
        with:
          name-selector: linode_token

      - name: Resolve OpenVPN/DNS VPN source
        id: vpn-source
        if: inputs.enforce_cluster_boundary
        env:
          CONTRACT_PATH: ${{ github.workspace }}/config/worker-firewall/${{ inputs.environment }}.json
        run: |
          parameter_path="$(jq -er '.vpn_server.ssm_parameter_path' "${CONTRACT_PATH}")"
          vpn_ip="$(aws ssm get-parameter \
            --name "${parameter_path}" \
            --query Parameter.Value \
            --output text)"
          if [ -z "${vpn_ip}" ] || [ "${vpn_ip}" = "None" ]; then
            echo "::error title=Missing VPN Source::OpenVPN/DNS VPN public egress IP is unavailable"
            exit 1
          fi
          echo "ip=${vpn_ip}" >> "$GITHUB_OUTPUT"
          echo "terraform_input_required=$(jq -r '
            (.control_plane_acl.activation_enabled // false) or
            ([.clusters[].activation_enabled // false] | any)
          ' "${CONTRACT_PATH}")" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -reconfigure \
            -input=false
        env:
          TF_VAR_linode_token: ${{ env.LINODE_TOKEN }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          set +e

          # 根據是否存在 tfvars 決定是否傳入 — 不是所有環境都有提交 tfvars
          TFVARS_ARGS=()
          if [ -f "terraform.tfvars" ]; then
            TFVARS_ARGS=(-var-file=terraform.tfvars)
          fi

          if [ "${VPN_TERRAFORM_INPUT_REQUIRED}" = "true" ]; then
            export TF_VAR_vpn_server_public_egress_ip="${VPN_SOURCE_IP}"
          fi

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan \
            "${TFVARS_ARGS[@]}" \
            > terraform-plan.log 2>&1

          PLAN_EXIT=$?
          set -e

          grep -v -iE "^\s*(token|secret|pass[w]ord)\s*=" terraform-plan.log || true

          case "${PLAN_EXIT}" in
            0) echo "No Terraform changes detected." ;;
            2) echo "Terraform changes detected." ;;
            1) echo "::error title=Plan Failed::terraform plan exited with error" ; exit 1 ;;
            *) echo "::error title=Plan Failed::terraform plan exited with unexpected code ${PLAN_EXIT}" ; exit 1 ;;
          esac
        env:
          TF_VAR_linode_token: ${{ env.LINODE_TOKEN }}
          TF_VAR_write_kubeconfig_files: "false"
          VPN_SOURCE_IP: ${{ steps.vpn-source.outputs.ip }}
          VPN_TERRAFORM_INPUT_REQUIRED: ${{ steps.vpn-source.outputs.terraform_input_required }}

      - name: Validate Cluster Boundary Plan
        if: inputs.enforce_cluster_boundary
        env:
          TARGET_ENV: ${{ inputs.environment }}
          CONTRACT_PATH: ${{ github.workspace }}/config/worker-firewall/${{ inputs.environment }}.json
          VPN_SOURCE_IP: ${{ steps.vpn-source.outputs.ip }}
        run: |
          terraform show -json tfplan > tfplan.json
          bash "${GITHUB_WORKSPACE}/scripts/verify-cluster-boundary-plan.sh" \
            "${TARGET_ENV}" \
            "${CONTRACT_PATH}" \
            tfplan.json \
            "${VPN_SOURCE_IP}/32"

      - name: Post Plan Summary
        if: always()
        run: |
          {
            echo "## Terraform Plan: \`${{ inputs.plan_key }}\`"
            echo ""
            if [ -f tfplan ]; then
              echo '```hcl'
              terraform show -no-color tfplan > terraform-plan-show.log 2>&1
              grep -v -iE "^\s*(token|secret|pass[w]ord)\s*=" terraform-plan-show.log | head -200 || true
              echo '```'
            else
              echo "_Plan file not available_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
