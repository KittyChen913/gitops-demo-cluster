name: "Workflow Quality"

on:
  workflow_call:

  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: "Lint GitHub Actions"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  shellcheck:
    name: "Lint Shell Scripts"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Test Cluster Boundary Guard
        run: bash tests/test-cluster-boundary-plan.sh

      - name: Test Cluster Health Stability
        run: bash tests/test-check-cluster-health.sh

      - name: Test Cluster Discovery Targets
        run: bash tests/test-discover-cluster-targets.sh

      - name: Test Firewall Attachment Reconciliation
        run: bash tests/test-reconcile-lke-firewall-attachments.sh
