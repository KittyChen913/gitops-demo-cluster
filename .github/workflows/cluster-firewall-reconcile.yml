# =============================================================================
# cluster-firewall-reconcile.yml — LKE replacement Node Firewall attachment 收斂
# =============================================================================
# Standard LKE replacement 會改變底層 Linode instance ID。此 workflow 只補上
# Terraform-managed Firewall 缺少的 current node attachment；不修改 rules、policy
# 或刪除 attachment。Dev 定期執行，prod 只允許手動並沿用 prod Environment approval。
# =============================================================================

name: "Cluster Firewall Attachment Reconciliation"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        required: true
        default: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  resolve-environment:
    name: "Resolve Environment"
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}

    steps:
      - name: Resolve Target Environment
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "${EVENT_NAME}" = "schedule" ]; then
            target_environment="dev"
          else
            target_environment="${INPUT_ENVIRONMENT}"
          fi

          case "${target_environment}" in
            dev|prod) ;;
            *)
              echo "::error title=Invalid Environment::Unsupported environment"
              exit 1
              ;;
          esac

          echo "environment=${target_environment}" >> "${GITHUB_OUTPUT}"

  reconcile:
    name: "Reconcile Firewall Attachments [${{ needs.resolve-environment.outputs.environment }}]"
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}

    concurrency:
      group: tf-apply-${{ needs.resolve-environment.outputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ap-southeast-1

      - name: Fetch Linode Credential
        uses: ./.github/actions/get-ssm-parameters
        with:
          ssm_param_path: "/gitops/shared"

      - name: Terraform Init
        working-directory: terraform/environments/${{ needs.resolve-environment.outputs.environment }}
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -reconfigure \
            -input=false

      - name: Reconcile LKE Firewall Attachments
        id: reconcile
        working-directory: terraform/environments/${{ needs.resolve-environment.outputs.environment }}
        run: bash "${GITHUB_WORKSPACE}/scripts/reconcile-lke-firewall-attachments.sh"

      - name: Post Reconciliation Summary
        if: always()
        env:
          TARGET_ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          {
            echo "## Cluster Firewall Attachment Reconciliation"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Environment | \`${TARGET_ENVIRONMENT}\` |"
            echo "| Operation | Attach missing current LKE nodes only |"
            echo "| Result | ${RECONCILE_OUTCOME} |"
          } >> "${GITHUB_STEP_SUMMARY}"
